#
# How "make generate" turns openapi.yaml into the Go side of the browser API
# (doc/adr/0011-openapi-first-browser-api.md). The release of oapi-codegen
# that reads this file is pinned in the Makefile. The paths are relative to
# the root of the checkout, which is where make runs the generator.

package: api
# One file, named so that .golangci.yml and REUSE.toml recognise it as
# generated: it is neither linted nor formatted here, and its copyright and
# licence are stated in REUSE.toml, since the two lines that state them are
# not in the header the generator writes.
output: internal/api/api.gen.go

generate:
  # The Go types of the schemas.
  models: true
  # The routing, written for chi. chi is the router of internal/server
  # already, so the generated code brings no requirement of its own, and its
  # hooks let the server answer an address the API does not know in the
  # error shape of the API. The generator's net/http output would need no
  # more modules, but http.ServeMux answers such an address in plain text.
  chi-server: true
  # The strict interface: an operation is a method that takes a typed
  # request and returns one of the answers the document declares for it, so
  # a handler cannot write an answer the document does not know.
  strict-server: true

compatibility:
  # ErrorCodeNotFound, not NotFound: the constant of an enum value carries
  # the name of its type from the first enum on. Without this the generator
  # adds the prefix only once two enums share a value, which would rename
  # constants that code already uses.
  always-prefix-enum-values: true

output-options:
  user-templates:
    # The head of the generated file, in place of the generator's own
    # template of this name. The generator opens the file with a package
    # comment ("Package api provides primitives ..."). A package has one
    # package comment, and that of package api is written by hand in
    # internal/api/doc.go, which says what the package owns and how it is
    # regenerated. So here the line that marks the file as generated stands
    # apart from the package clause, where it is no package comment.
    #
    # Everything else is the generator's template as release v2.8.0 has it
    # (pkg/codegen/templates/imports.tmpl in
    # github.com/oapi-codegen/oapi-codegen, Apache-2.0): every import the
    # generated code may need, of which the generator then drops the unused
    # ones. When the release in the Makefile is raised, this copy is compared
    # with the template of the new release.
    imports.tmpl: |
      {{- if opts.Generate.StdHTTPServer}}//go:build go1.22

      {{- end}}
      // Code generated by {{.ModuleName}} version {{.Version}} DO NOT EDIT.

      package {{.PackageName}}

      import (
        "bytes"
        "compress/flate"
        "context"
        "encoding/base64"
        "encoding/json"
        "encoding/xml"
        "errors"
        "fmt"
        "go.yaml.in/yaml/v3"
        "io"
        "os"
        "mime"
        "mime/multipart"
        "net/http"
        "net/url"
        "path"
        "strings"
        "time"

        "github.com/oapi-codegen/runtime"
        "github.com/oapi-codegen/nullable"
        openapi_types "github.com/oapi-codegen/runtime/types"
        "github.com/getkin/kin-openapi/openapi3"
        {{- range .RouterImports}}
        {{if .Alias}}{{.Alias}} {{end}}"{{.Package}}"
        {{- end}}
        {{- range .ExternalImports}}
        {{ . }}
        {{- end}}
        {{- range .AdditionalImports}}
        {{.Alias}} "{{.Package}}"
        {{- end}}
      )
